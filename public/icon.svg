<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17968b"/><stop offset="1" stop-color="#0a4f4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#042321" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#042321" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- La route en forme de C, avec son marquage -->
  <g filter="url(#drop)">
    <path d="M362 150 A150 150 0 1 0 362 362" fill="none" stroke="#14232b" stroke-width="92" stroke-linecap="round"/>
    <path d="M362 150 A150 150 0 1 0 362 362" fill="none" stroke="#22343d" stroke-width="80" stroke-linecap="round"/>
  </g>
  <path d="M352 140 A150 150 0 1 0 352 372" fill="none" stroke="#f5b301" stroke-width="11" stroke-linecap="round" stroke-dasharray="30 30"/>
  <!-- Deux personnes qui partagent le trajet -->
  <g filter="url(#soft)">
    <circle cx="236" cy="256" r="50" fill="#ffffff"/>
    <circle cx="300" cy="256" r="50" fill="#f5b301" stroke="#0c5b55" stroke-width="10"/>
  </g>
</svg>
